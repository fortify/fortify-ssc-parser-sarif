name: Fortify on Demand Scan

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '16 0 * * 5'

permissions:
  read-all

jobs:
  FoD-Scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: fortify/shared-github/.github/workflows/reusable-fortify-analysis.yml@5ad1afec0f56a21b03f0887eea35505cb6a66554
    with:
      java-version: '17'
    secrets: inherit
