on:
  push:
    branches:
      - main

env:
  DIST_DIR: ${{ github.workspace }}/build/dist
  DO_RELEASE: ''
  RELEASE_TAG: ''
  RELEASE_VERSION: ''

name: Build production release
permissions:
  read-all

jobs:
  build-and-release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check-out source code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554

      - name: Generate and process release PR
        id: release_please
        uses: fortify/shared-github/actions/3rdparty/googleapis/release-please-action/v5@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          release-type: simple
          target-branch: ${{ github.ref_name }}

      - name: Define production release info
        if: steps.release_please.outputs.release_created
        run: |
          tag=${{steps.release_please.outputs.tag_name}}
          version=${{steps.release_please.outputs.version}}
          major=${{steps.release_please.outputs.major}}
          minor=${{steps.release_please.outputs.minor}}
          patch=${{steps.release_please.outputs.patch}}
          echo DO_RELEASE=true >> $GITHUB_ENV
          echo RELEASE_TAG=${tag} >> $GITHUB_ENV
          echo RELEASE_VERSION=${version} >> $GITHUB_ENV

      - name: Build production release
        if: env.DO_RELEASE
        run: ./gradlew dist distThirdParty -Pversion=${{env.RELEASE_VERSION}}

      - name: Upload assets to release
        if: env.DO_RELEASE
        run: |
          tag=${{ steps.release_please.outputs.tag_name }}
          files=$(find "${{ env.DIST_DIR }}" -type f -printf "%p ")
          gh release upload "${tag}" $files --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
